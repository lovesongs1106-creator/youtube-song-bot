name: Lint & Smoke Test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile all Python files
        run: |
          python -m py_compile \
            telegram_bot.py bot.py github_worker.py downloaders.py \
            facebook_pipeline.py convert_cookies.py test_pipeline.py \
            agents/*.py scripts/*.py

      - name: Run stdlib smoke test (no deps, no network)
        run: python scripts/smoke_test.py

      - name: Validate GitHub Actions workflows
        run: python scripts/validate_workflow.py
