version: "3.8"

services:
  cobalt:
    image: ghcr.io/imputnet/cobalt:main
    container_name: cobalt-api
    ports:
      - "9000:9000"
    environment:
      - API_URL=${COBALT_SELF_URL:-http://localhost:9000}
      - API_PORT=9000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
